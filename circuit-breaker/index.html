<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../index.html" rel="icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Breaker — Region 701</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--accent:#d97706;--accent-light:#fde68a;--cream:#f4f7fa;--text-dark:#2c3440;--text-mid:#566374;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text-dark);min-height:100vh;}
.lang-bar{display:flex;justify-content:center;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--cream);}
.lang-btn{border:2px solid var(--accent-light);background:rgba(255,255,255,0.92);border-radius:50px;padding:4px 9px;font-family:'Nunito',sans-serif;font-size:0.72rem;font-weight:800;color:var(--text-mid);cursor:pointer;transition:all 0.2s;}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.top-bar{background:linear-gradient(135deg,var(--accent) 0%,#b45309 100%);padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
.back-btn{background:rgba(255,255,255,0.25);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0;transition:background 0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.4);}
.top-title{font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,0.2);flex:1;}
.top-emoji{font-size:1.8rem;}
.content{padding:20px 16px 40px;max-width:640px;margin:0 auto;}
.back-footer{text-align:center;margin-top:28px;padding-bottom:20px;}
.back-footer a{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;font-size:1rem;text-decoration:none;background:var(--accent-light);padding:12px 24px;border-radius:50px;transition:opacity 0.2s;}
.back-footer a:hover{opacity:0.8;}

  /* text info card */
  .info-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    margin: 18px 0;
    box-shadow: 0 2px 12px rgba(120,80,60,0.08);
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text-mid);
  }
  .info-card h3 {
    font-size: 0.95rem;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .info-card ul { padding-left: 1.2em; }
  .info-card li { margin-bottom: 4px; }
  .info-card .tel {
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--text-dark);
    letter-spacing: 0.03em;
  }
</style>
  <link rel="stylesheet" href="../assets/cute-pack.css">
  <style id="cute-pack-theme">:root{--cp-chip-a:#e8f5e9;--cp-chip-b:#fff3e8;--cp-hover-shadow:rgba(217,119,6,.18);--cp-dot-1:rgba(165,214,167,.12);}</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en',this)">🇬🇧 EN</button>
  <button class="lang-btn" onclick="setLang('ja',this)">🇯🇵 JA</button>
  <button class="lang-btn" onclick="setLang('zh',this)">🇨🇳 ZH</button>
  <button class="lang-btn" onclick="setLang('ko',this)">🇰🇷 KO</button>
  <button class="lang-btn" onclick="setLang('fr',this)">🇫🇷 FR</button>
  <button class="lang-btn" onclick="setLang('es',this)">🇪🇸 ES</button>
</div>
<div class="top-bar">
  <a href="../" class="back-btn">←</a>
  <span class="top-emoji">⚡</span>
  <div class="top-title" data-i18n="pageTitle">Circuit Breaker</div>
</div>
<div class="content">

<div class="info-card">
  <h3 data-i18n="cbTitle">How to reset the circuit breaker</h3>
  <p data-i18n="cbBody">The circuit breaker box is above the refrigerator. If the power goes out, open the box and flip the tripped switch back up to reset it.</p>
</div>

  <div class="back-footer">
  <a href="../" data-i18n="backToMenu">← Back to Menu</a>
</div>
</div>
<script>
const S={
  en:{pageTitle:'Circuit Breaker',backToMenu:'← Back to Menu',cbTitle:'How to reset the circuit breaker',cbBody:'The circuit breaker box is above the refrigerator. If the power goes out, open the box and flip the tripped switch back up to reset it.'},
  ja:{pageTitle:'ブレーカー',backToMenu:'← メニューへ戻る',cbTitle:'ブレーカーの復旧方法',cbBody:'ブレーカーは冷蔵庫の上にあります。停電した場合はボックスを開け、下がっているスイッチを上に戻してください。'},
  zh:{pageTitle:'断路器',backToMenu:'← 返回菜单',cbTitle:'如何复位断路器',cbBody:'断路器箱位于冰箱上方。如果停电，请打开箱盖，将跳闸的开关向上拨回复位。'},
  ko:{pageTitle:'누전차단기',backToMenu:'← 메뉴로 돌아가기',cbTitle:'차단기 복구 방법',cbBody:'차단기함은 냉장고 위에 있습니다. 정전 시 함을 열고 내려간 스위치를 위로 올려 복구해 주세요.'},
  fr:{pageTitle:'Disjoncteur',backToMenu:'← Retour au menu',cbTitle:'Comment réarmer le disjoncteur',cbBody:'Le tableau électrique se trouve au-dessus du réfrigérateur. En cas de coupure de courant, ouvrez le boîtier et relevez le disjoncteur qui a sauté.'},
  es:{pageTitle:'Disyuntor',backToMenu:'← Volver al menú',cbTitle:'Cómo restablecer el disyuntor',cbBody:'El cuadro eléctrico está encima del frigorífico. Si se corta la luz, abra la caja y suba el interruptor que haya saltado.'}
};
function setLang(l,btn){document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const t=S[l];if(!t)return;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(k in t)el.textContent=t[k];});}
setLang('en',document.querySelector('.lang-btn.active'));
</script>
  <script src="../assets/cute-pack.js" defer></script>
</body>
</html>
